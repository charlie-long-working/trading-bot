# Cập nhật dữ liệu FRED mỗi tuần → commit & push → Streamlit tự redeploy
# Cần thêm FRED_API_KEY trong Settings → Secrets and variables → Actions

name: Update VRE Data

on:
  schedule:
    # Chạy mỗi thứ Hai lúc 00:00 UTC (07:00 VN)
    - cron: "0 0 * * 1"
  workflow_dispatch:  # Cho phép chạy thủ công

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet pandas fredapi python-dotenv

      - name: Fetch and update FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python vre/scripts/update_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vre/data/fred/ vre/data/last_updated.txt
          git diff --staged --quiet || (git commit -m "chore(vre): auto-update FRED data [skip ci]" && git push)
